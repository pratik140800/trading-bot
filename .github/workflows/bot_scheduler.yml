name: Bot Scheduler
on:
  schedule:
    - cron: '50 3 * * 1-5'
    - cron: '50 4 * * 1-5'
    - cron: '50 5 * * 1-5'
    - cron: '50 6 * * 1-5'
    - cron: '50 7 * * 1-5'
    - cron: '50 8 * * 1-5'
    - cron: '50 9 * * 1-5'
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        run: git clone https://github.com/${{ github.repository }}.git .
      - name: Set up Python
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip
      - name: Install libraries
        run: pip3 install yfinance pandas numpy requests
      - name: Run the Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 ultimate_screener.py
