name: Hourly Trading Signals

on:
  schedule:
    # 9:20, 10:20, 11:20, 12:20, 1:20, 2:20, 3:20 PM IST (Mon-Fri)
    - cron: '50 3 * * 1-5'
    - cron: '50 4 * * 1-5'
    - cron: '50 5 * * 1-5'
    - cron: '50 6 * * 1-5'
    - cron: '50 7 * * 1-5'
    - cron: '50 8 * * 1-5'
    - cron: '50 9 * * 1-5'
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests

      - name: Run Trading Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ultimate_screener.py
